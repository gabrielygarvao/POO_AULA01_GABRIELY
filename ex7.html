<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex 7</title>
    <script>
        class Produto {
            constructor(id, nome, preco, estoque) {
                this.id = id;
                this.nome = nome;
                this.preco = preco;
                this.estoque = estoque;
            }
        }
        
        class Carrinho {
            constructor() {
                this.itens = [];
            }
        
            adicionarProduto(produto, quantidade) {
                if (quantidade <= produto.estoque) {
                    produto.estoque -= quantidade;
        
                    this.itens.push({
                        produto: produto,
                        quantidade: quantidade
                    });
        
                    console.log(`${quantidade} unidade de ${produto.nome} adicionada ao carrinho.`);
                } else {
                    console.log(
                        `Erro: estoque insuficiente. Quantidade disponível: ${produto.estoque}`
                    );
                }
            }
        }
        
        // Exemplo
        const produto1 = new Produto(1, "Notebook", 3000, 5);
        const carrinho = new Carrinho();
        
        carrinho.adicionarProduto(produto1, 2);
        carrinho.adicionarProduto(produto1, 4);
        
        console.log(produto1);
        console.log(carrinho.itens);
    </script>
</head>
