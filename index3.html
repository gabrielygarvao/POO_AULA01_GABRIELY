<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>objeto literal</title>
    <script>
        const pessoa = {
            nome:"Maria",
            idade: 25,
            cumprimentar(){
                console.log(`olá eu sou ${this.nome} !!!!!! :3`)
            }
        }
        pessoa.cumprimentar();
    </script>
    
</head>
