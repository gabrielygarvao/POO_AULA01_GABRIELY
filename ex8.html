<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex 8</title>
    <script>
        class Personagem {
            constructor(nome, vida = 100, ataque = 15) {
                this.nome = nome;
                this.vida = vida;
                this.ataque = ataque;
            }

            atacar(alvo) {
                if (this.vida <= 0) {
                    console.log(`${this.nome} foi dederrotado e não pode realizar ataques.`);
                    return;
                }

                alvo.vida -= this.ataque;

                console.log(
                    `${this.nome} atacou ${alvo.nome} causando ${this.ataque} de dano.`
                );

                if (alvo.vida <= 0) {
                    alvo.vida = 0;
                    console.log(`${alvo.nome} foi derrotado!`);
                }
            }
        }

        const Kian = new Personagem("Kian", 100, 20);
        const Kaiser = new Personagem("Kaiser", 80, 15);
        console.log("Personagens > Kian e Kaiser");
    </script>
</head>
